name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # cmp-bridge-sample's DemoScenarioTest launches a real desktop app subprocess and drives it
      # through a real ComposeWindow/AWT input events (see CONTRIBUTING.md) — ubuntu-latest runners
      # have no X server at all, so that subprocess fails to open a window without one. Xvfb is a
      # virtual framebuffer X server that satisfies this without needing an actual GUI environment.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build
        run: xvfb-run --auto-servernum ./gradlew build --console=plain
