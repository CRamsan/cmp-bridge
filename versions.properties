# Plugins take no version in build.gradle.kts's `plugins {}` blocks (bare `id("...") apply false`
# at the root, bare `id("...")` in every submodule — ordinary Gradle multi-project plugin-version
# inheritance). refreshVersions resolves the actual version via the `plugin.<pluginId>=<version>`
# entries below (Kotlin plugins ride the existing `version.kotlin` shorthand instead of needing
# their own entry). Note this is a DIFFERENT mechanism from the `:_` placeholder used for library
# dependencies further down: `id("...") version "_"` does not work in a `plugins {}` block here —
# Gradle tries to resolve a literal artifact version "_" and errors. Omitting the version entirely
# is what makes refreshVersions' plugin-resolution hook apply instead.

