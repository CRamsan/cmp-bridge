org.gradle.jvmargs=-Xmx4096m
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

android.useAndroidX=true

compileSdkVersion=36
minSdkVersion=30
jdkVersion=21

# Bytecode target for the published jvm library artifacts (cmp-bridge's jvm target,
# cmp-bridge-driver) — deliberately lower than jdkVersion (issue #13). jdkVersion is only the
# toolchain that *builds* the project; nothing in either module's own code or api(...)
# dependencies requires JDK 21, and pinning the published bytecode to it broke consumers with a
# JVM 17-pinned classpath. Not applied to cmp-bridge's android target or the CLI-only
# http-server/mcp-server modules, which are never resolved as a Gradle library dependency.
libraryJvmTarget=17

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Maven coordinates for the modules published to Maven Central — see RELEASING.md.
GROUP=com.cramsan.cmpbridge
VERSION_NAME=0.1.0-SNAPSHOT
